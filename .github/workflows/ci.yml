name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://budget_user:budget_pass@localhost:5432/budget_calc

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: budget_user
          POSTGRES_PASSWORD: budget_pass
          POSTGRES_DB: budget_calc
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run build
      - run: npm run lint
      - run: npx prisma validate
        working-directory: apps/api
